<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>주식 매매 관리</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#18202a;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--accent2:#eff6ff;--danger:#dc2626;--good:#15803d;--warn:#b45309;--shadow:0 10px 30px rgba(20,30,50,.07);--r:18px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:1080px;margin:auto;padding:18px 14px 44px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin:4px 0 14px}.top h1{margin:0;font-size:28px;letter-spacing:-1.2px}.sub{font-size:13px;color:var(--muted);margin-top:4px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:#e9edf2;padding:4px;border-radius:14px;position:sticky;top:0;z-index:10}.tab{padding:11px 6px;white-space:nowrap;min-width:0;border-radius:10px;background:transparent;color:#596270;font-weight:800}.tab.active{background:#fff;color:var(--text);box-shadow:0 2px 8px #0000000d}.page{display:none;margin-top:14px}.page.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}.card h2,.card h3{margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:0 0 6px}.input,.select,.textarea{width:100%;border:1px solid #d9dee6;border-radius:12px;background:#fff;outline:0}.input,.select{height:46px;padding:0 12px}.textarea{min-height:88px;padding:10px 12px;resize:vertical}.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #2563eb18}.btn{min-height:42px;padding:0 14px;border-radius:12px;background:#eef2f7;color:#26303c;font-weight:800}.btn.primary{background:var(--accent);color:#fff}.btn.good{background:#ecfdf3;color:var(--good)}.btn.danger{background:#fef2f2;color:var(--danger)}.actions{display:flex;gap:8px;flex-wrap:wrap}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#f8fafc;border-radius:14px;padding:13px}.metric .k{font-size:11px;color:var(--muted);font-weight:800}.metric .v{font-size:19px;font-weight:900;margin-top:5px;letter-spacing:-.4px}.metric.big{background:#111827;color:#fff}.metric.big .k{color:#cbd5e1}.metric.good .v{color:var(--good)}.metric.danger .v{color:var(--danger)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.position{border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:10px;background:#fff}.position-title{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.name{font-size:18px;font-weight:900;color:#047857}.muted{color:var(--muted);font-size:12px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#eef2ff;color:#3730a3}.badge.closed{background:#f1f5f9;color:#64748b}.price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.price-box{padding:11px;border-radius:12px;background:#f8fafc}.price-box .k{font-size:11px;color:var(--muted);font-weight:800}.price-box .v{font-size:17px;font-weight:900;margin-top:4px}.price-box.target{background:#fef2f2}.price-box.target .v{color:#dc2626}.price-box.breakeven{background:#f0fdf4}.price-box.stop{background:#eff6ff}.price-box.stop .v{color:#2563eb}.quick{display:grid;grid-template-columns:minmax(120px,180px) minmax(0,1fr);gap:8px;align-items:end;margin-top:10px}.quick .sim-price{min-width:0}.quick .sim-mini{width:34px;height:46px;min-height:46px;padding:0;border-radius:10px;font-size:17px;display:flex;align-items:center;justify-content:center;line-height:1}.quick .sim-save{background:#ecfdf3;color:#15803d;border:1px solid #bbf7d0}.quick .sim-clear{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}.quick .sim-result{min-width:0;font-size:12px;line-height:1.4}.quick .sim-result b{white-space:nowrap}.saved-plan{position:relative;padding-right:42px!important}.saved-plan-x{position:absolute;right:9px;top:9px;width:28px;height:28px;min-height:28px;padding:0;border-radius:50%;background:#fef2f2;color:#dc2626;font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center;line-height:1}.nowrap-delete{white-space:nowrap;flex:0 0 auto}.detail{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.event{display:grid;grid-template-columns:85px 1fr 90px 70px;gap:8px;padding:7px 0;border-bottom:1px solid #f1f5f9;font-size:12px}.event:last-child{border-bottom:0}.note{font-size:12px;line-height:1.55;color:var(--muted)}.exchange-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:8px 11px;border-radius:999px;background:#f1f5f9;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:6px;line-height:1.2;min-height:34px}.chip input[type="checkbox"]{margin:0;flex:0 0 auto;vertical-align:middle}.chip.on{background:#111827;color:#fff}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:8px;border-bottom:1px solid #eef2f7;white-space:nowrap;text-align:left}.table th{color:var(--muted)}.watering-modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.watering-box{border:1px solid var(--line);border-radius:14px;padding:14px}.saved-plan{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}.settings-group{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.tiny{font-size:11px;color:var(--muted)}.hidden{display:none!important}.trade-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.trade-actions .btn{padding:0 8px;white-space:nowrap}.btn.buy{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}.btn.sell{background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe}.market-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px}.market-toggle .btn.on{background:#111827;color:#fff}.save-flash{animation:savePulse .5s ease}@keyframes savePulse{0%{transform:scale(1)}45%{transform:scale(.96)}100%{transform:scale(1)}} .mobile-only{display:none}
@media(max-width:760px){.top{display:flex;align-items:center}.tabs{margin-top:12px}.grid3,.watering-modes{grid-template-columns:1fr}.summary,.price-grid{grid-template-columns:1fr 1fr}.summary .metric:first-child{grid-column:1/-1}.event{grid-template-columns:72px 1fr}.event>*:nth-child(n+3){text-align:left}.exchange-row{grid-template-columns:1fr}.actions .btn{flex:1}.position-title{align-items:center}}
@media(max-width:460px){.quick{grid-template-columns:minmax(105px,145px) minmax(0,1fr);gap:6px}.quick .sim-mini{width:32px;min-height:32px}.quick .sim-result{font-size:11px}.app{padding:12px 10px 32px}.top h1{font-size:24px}.tab{font-size:12px;padding:10px 5px}.grid,.summary,.price-grid{grid-template-columns:1fr}.summary .metric:first-child{grid-column:auto}.card{padding:14px}}

/* 모바일: 국장·미장·기록 숫자 정보만 2열로 압축 */
@media(max-width:760px){
  #us .desktop-us-exchange,#us .desktop-us-summary{display:none}
  #us .mobile-only{display:block}
  #kr .market-top-summary,#us .market-top-summary,#kr .position-summary,#us .position-summary,#history .history-summary{grid-template-columns:repeat(2,minmax(0,1fr))}
  #kr .market-top-summary .metric:first-child,#us .market-top-summary .metric:first-child,#kr .position-summary .metric:first-child,#us .position-summary .metric:first-child,#history .history-summary .metric:first-child{grid-column:auto}
  #history .history-summary .metric:last-child{grid-column:1/-1}
  #kr .position-summary .metric,#us .position-summary .metric,#kr .price-grid .price-box,#us .price-grid .price-box{min-height:72px;display:flex;flex-direction:column;justify-content:center}
  #kr .price-grid,#us .price-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  #us .us-mobile-overview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
  #us .us-mobile-overview .metric{min-height:76px}
  #us .exchange-row{margin:0;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:end}
  #us .exchange-row .field label{font-size:10px;margin-bottom:4px}
  #us .exchange-row .input{height:38px;padding:0 8px}
  #us .exchange-row .btn{height:38px;min-height:38px;padding:0 9px;font-size:11px;white-space:nowrap}
}
@media(max-width:460px){
  #kr .market-top-summary,#us .market-top-summary,#kr .position-summary,#us .position-summary,#history .history-summary{grid-template-columns:repeat(2,minmax(0,1fr))}
  #kr .price-grid,#us .price-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media(min-width:1200px){
  .app{max-width:min(96vw,2220px);padding-left:20px;padding-right:20px}
  #kr,#us,#history,#watering,#ai{width:100%}
  .history-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .history-grid>.card{margin-bottom:0}
  .watering-saved-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .watering-saved-grid>.saved-plan{margin-top:0}
}
@media(min-width:1600px){
  #KRList,#USList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
  #KRList>.position,#USList>.position{margin-top:0}
  .watering-saved-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}


/* 모바일: 현재평단|보유수량 / 총투자액|목표 / 최소순익|손절 */
@media(max-width:760px){
  #kr .position-metrics-six,#us .position-metrics-six{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;
    margin:10px 0 12px;
  }
  #kr .position-metrics-six>.position-summary,
  #kr .position-metrics-six>.price-grid,
  #us .position-metrics-six>.position-summary,
  #us .position-metrics-six>.price-grid{
    display:contents;
  }
  #kr .position-metrics-six .metric,
  #kr .position-metrics-six .price-box,
  #us .position-metrics-six .metric,
  #us .position-metrics-six .price-box{
    min-height:72px;
    margin:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  #kr .position-metrics-six .position-summary .metric:nth-child(1),
  #us .position-metrics-six .position-summary .metric:nth-child(1){grid-column:1;grid-row:1}
  #kr .position-metrics-six .position-summary .metric:nth-child(2),
  #us .position-metrics-six .position-summary .metric:nth-child(2){grid-column:2;grid-row:1}
  #kr .position-metrics-six .position-summary .metric:nth-child(3),
  #us .position-metrics-six .position-summary .metric:nth-child(3){grid-column:1;grid-row:2}
  #kr .position-metrics-six .price-grid .price-box:nth-child(1),
  #us .position-metrics-six .price-grid .price-box:nth-child(1){grid-column:2;grid-row:2}
  #kr .position-metrics-six .price-grid .price-box:nth-child(2),
  #us .position-metrics-six .price-grid .price-box:nth-child(2){grid-column:1;grid-row:3}
  #kr .position-metrics-six .price-grid .price-box:nth-child(3),
  #us .position-metrics-six .price-grid .price-box:nth-child(3){grid-column:2;grid-row:3}
}

</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>주식 매매 관리</h1></div>
    <div class="actions"><button class="btn" id="openSettings">설정</button></div>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="kr">국장</button>
    <button class="tab" data-tab="us">미장</button>
    <button class="tab" data-tab="history">기록</button>
    <button class="tab" data-tab="watering">물타기</button>
    <button class="tab" data-tab="ai">AI</button>
  </div>

  <section id="kr" class="page active"></section>
  <section id="us" class="page"></section>
  <section id="history" class="page"></section>
  <section id="watering" class="page"></section>
  <section id="ai" class="page"></section>
</div>

<div id="modal" class="hidden" style="position:fixed;inset:0;background:#0008;z-index:30;padding:16px;overflow:auto">
  <div class="card" style="max-width:760px;margin:28px auto" id="modalCard"></div>
</div>

<script>
const KEY='stock_manager_v2';
const OLD_KEY='stock_manager_v1';
const DEFAULT_PRESETS=[
  {id:crypto.randomUUID(),name:'초단타',target:1.0,stop:-0.7},
  {id:crypto.randomUUID(),name:'단타',target:2.0,stop:-1.5},
  {id:crypto.randomUUID(),name:'여유단타',target:3.0,stop:-2.0},
  {id:crypto.randomUUID(),name:'스윙',target:5.0,stop:-3.0},
  {id:crypto.randomUUID(),name:'장기보유',target:15.0,stop:-8.0}
];
const DEFAULT_TAGS=['뉴스/이슈','실적 기대','실적 발표 후','돌파','눌림목','반등 기대','과매도 판단','추세 추종','지지선 진입','분할매수','물타기','단타 연습','스윙 진입','충동매수','기타'];
const DEFAULT_AI_PROMPTS=[
  {name:'매수 판단',description:'선택한 종목의 신규매수·추가매수 여부를 검토합니다.',text:`선택한 종목의 매수 판단을 도와줘. 최신 정보가 필요한 내용은 현재 시점의 자료를 확인하고, 내가 제공한 보유정보가 있다면 평단과 수량도 함께 고려해줘. 단순히 매수/비매수 결론만 내리지 말고 ① 현재 주가 흐름과 위치 ② 최근 뉴스·공시·실적·수급 등 핵심 재료 ③ 상승 가능 요인과 하락 위험 ④ 지금 진입할 때 확인해야 할 가격대와 조건 ⑤ 신규매수 또는 추가매수 시 주의할 점을 구분해서 설명해줘. 확실하지 않은 내용은 추정이라고 표시하고, 마지막에는 내가 직접 판단할 수 있도록 핵심 체크포인트를 짧게 정리해줘.`},
  {name:'매도 판단',description:'보유 종목을 계속 보유할지, 일부·전량 매도를 검토합니다.',text:`선택한 보유 종목의 매도 판단을 도와줘. 내가 제공한 평단과 수량을 기준으로 현재 위치를 함께 고려하고, 최신 정보가 필요한 내용은 현재 자료를 확인해줘. ① 현재 추세와 모멘텀 ② 최근 뉴스·공시·실적 등 보유 논리를 바꿀 만한 요소 ③ 추가 상승 여력과 하락 위험 ④ 계속 보유·일부 정리·전량 정리를 각각 고려할 조건 ⑤ 수익 중일 때와 손실 중일 때의 대응 포인트를 구분해서 설명해줘. 특정 행동을 단정하기보다 각 선택의 근거와 위험을 보여주고 마지막에 내가 확인할 핵심 조건을 정리해줘.`},
  {name:'물타기 판단',description:'손실 종목의 추가매수가 합리적인지 위험까지 함께 점검합니다.',text:`선택한 보유 종목에 물타기 또는 추가매수를 고려하고 있어. 현재 평단과 수량을 기준으로, 단순히 평단이 낮아진다는 이유가 아니라 지금 추가매수가 합리적인지 분석해줘. ① 하락 원인이 일시적인지 구조적인지 ② 기업·업종의 핵심 악재와 회복 가능성 ③ 현재 가격대의 기술적 위치 ④ 추가매수했을 때 얻는 장점과 커지는 위험 ⑤ 물타기를 보류해야 할 신호 ⑥ 반등 시 탈출 또는 대응을 생각할 수 있는 조건을 정리해줘. 최신 정보가 필요한 부분은 확인하고, 불확실한 내용은 구분해서 표시해줘.`},
  {name:'보유종목 전체 점검',description:'선택한 여러 보유 종목을 한꺼번에 점검하고 우선 확인할 종목을 찾습니다.',text:`아래에 제공하는 보유 종목들을 한꺼번에 점검해줘. 각 종목별로 현재 상황, 최근 핵심 재료, 추세, 주요 위험요인, 내가 특히 확인해야 할 사항을 같은 기준으로 간결하게 정리해줘. 그 다음 종목들 사이의 중복 위험이나 업종 쏠림이 있는지도 확인해줘. 마지막에는 매수·매도 지시가 아니라 '지금 추가 확인이 필요한 종목과 그 이유'를 중심으로 우선 점검 목록을 만들어줘. 최신 정보가 필요한 부분은 현재 자료를 확인하고 사실과 해석을 구분해줘.`},
  {name:'매수 후보 비교 분석',description:'보유 여부와 관계없이 여러 후보 종목을 같은 기준으로 비교합니다.',text:`아래 종목들을 매수 후보로 비교 분석해줘. 보유 중인 종목 정보가 있으면 내 평단과 수량은 참고하되, 보유하지 않은 종목도 동일한 기준으로 봐줘. 각 종목의 ① 최근 주가 흐름 ② 실적과 성장성 ③ 최근 뉴스·공시와 촉매 ④ 밸류에이션 또는 가격 부담 ⑤ 주요 하락 위험 ⑥ 단기와 중기 관점에서 확인할 조건을 정리해줘. 단순 순위나 하나의 정답을 강요하지 말고 각 후보가 어떤 상황에서 더 적합하거나 위험한지 비교표 형태로 보여줘.`},

function makeDefaultAIPrompts(){return DEFAULT_AI_PROMPTS.map(x=>({id:crypto.randomUUID(),...x}))}
function freshDB(){return {version:2,positions:[],presets:DEFAULT_PRESETS.map(p=>({...p,id:crypto.randomUUID()})),tags:[...DEFAULT_TAGS],settings:{krMinProfit:1000,usMinProfit:1,exchangeRate:1400,aiExtraStocks:'',aiExtraEnabled:false,aiSelectedPromptId:'',aiSelectedHoldingIds:[]},wateringPlans:[],aiPrompts:makeDefaultAIPrompts(),aiPromptDefaultsSeeded:true,displaySeq:{KR:0,US:0}}}
const STOCK_DB_NAME='stock_manager_db';
const STOCK_DB_VERSION=1;
const STOCK_STORE='app';
const STOCK_DATA_KEY='main';
let stockDBPromise=null;
let db=freshDB();

function normalizeDB(x){
  if(!x||typeof x!=='object')return null;
  x.version=2;
  x.positions=Array.isArray(x.positions)?x.positions:[];
  x.presets=Array.isArray(x.presets)?x.presets:freshDB().presets;
  x.tags=Array.isArray(x.tags)?x.tags:[...DEFAULT_TAGS];
  x.settings=Object.assign({krMinProfit:1000,usMinProfit:1,exchangeRate:1400,aiExtraStocks:'',aiExtraEnabled:false,aiSelectedPromptId:'',aiSelectedHoldingIds:[]},x.settings||{});
  x.wateringPlans=Array.isArray(x.wateringPlans)?x.wateringPlans:[];
  x.aiPrompts=Array.isArray(x.aiPrompts)?x.aiPrompts:[];
  if(!x.aiPromptDefaultsSeeded){x.aiPrompts=[...x.aiPrompts,...makeDefaultAIPrompts()];x.aiPromptDefaultsSeeded=true}
  x.displaySeq=x.displaySeq||{KR:0,US:0};
  for(const p of x.positions){
    p.events=Array.isArray(p.events)?p.events:[];
    p.tradeMemo=p.tradeMemo||'';
    if(p.presetSnapshot&&!p.presetName)p.presetName=p.presetSnapshot.name||'직접설정';
    if(!p.presetName)p.presetName='직접설정';
    delete p.settingChanges;
  }
  return x;
}
function openStockDB(){
  if(stockDBPromise)return stockDBPromise;
  stockDBPromise=new Promise((resolve,reject)=>{
    const req=indexedDB.open(STOCK_DB_NAME,STOCK_DB_VERSION);
    req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(STOCK_STORE))d.createObjectStore(STOCK_STORE)};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error('IndexedDB open failed'));
  });
  return stockDBPromise;
}
async function idbGetStock(){
  const d=await openStockDB();
  return new Promise((resolve,reject)=>{
    const tx=d.transaction(STOCK_STORE,'readonly'),req=tx.objectStore(STOCK_STORE).get(STOCK_DATA_KEY);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error('IndexedDB read failed'));
  });
}
async function idbSetStock(value){
  const d=await openStockDB();
  return new Promise((resolve,reject)=>{
    const tx=d.transaction(STOCK_STORE,'readwrite');
    tx.objectStore(STOCK_STORE).put(value,STOCK_DATA_KEY);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error||new Error('IndexedDB write failed'));
    tx.onabort=()=>reject(tx.error||new Error('IndexedDB write aborted'));
  });
}
function loadLegacyDB(){
  for(const key of [KEY,OLD_KEY]){
    try{
      const raw=localStorage.getItem(key);
      if(!raw)continue;
      const x=normalizeDB(JSON.parse(raw));
      if(x)return x;
    }catch(e){}
  }
  return null;
}
async function initDB(){
  try{
    const stored=normalizeDB(await idbGetStock());
    if(stored){db=stored;return}
  }catch(e){console.error('IndexedDB 읽기 실패',e)}
  const legacy=loadLegacyDB();
  if(legacy){
    db=legacy;
    try{
      await idbSetStock(structuredClone(db));
      localStorage.removeItem(KEY);
      localStorage.removeItem(OLD_KEY);
    }catch(e){
      console.error('기존 데이터 IndexedDB 이전 실패',e);
      alert('기존 데이터의 IndexedDB 이전에 실패했습니다. 기존 localStorage 데이터는 삭제하지 않았습니다.');
    }
    return;
  }
  db=freshDB();
  try{await idbSetStock(structuredClone(db))}
  catch(e){console.error('초기 IndexedDB 저장 실패',e);alert('데이터 저장소를 초기화하지 못했습니다. 브라우저 저장소 상태를 확인해주세요.')}
}
async function save(){
  const snapshot=structuredClone(db);
  try{
    await idbSetStock(snapshot);
    return true;
  }catch(e){
    console.error('IndexedDB 저장 실패',e);
    try{localStorage.setItem(KEY,JSON.stringify(snapshot))}catch(_){}
    alert('저장에 실패했습니다. 안전용 localStorage 사본을 남기려고 시도했습니다. JSON 백업도 확인해주세요.');
    return false;
  }
}
function n(v){const x=Number(v);return Number.isFinite(x)?x:0}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(v,market='KR'){if(!Number.isFinite(Number(v)))return '-';const x=Number(v);return market==='US'?'$'+new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(x):'₩'+new Intl.NumberFormat('ko-KR',{maximumFractionDigits:0}).format(Math.round(x))}
function pct(v){return (Number(v)>=0?'+':'')+Number(v).toFixed(2)+'%'}
function fmtKRW(v){return '₩'+new Intl.NumberFormat('ko-KR',{maximumFractionDigits:0}).format(Math.round(Number(v)||0))}
function seoulParts(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());return Object.fromEntries(parts.map(x=>[x.type,x.value]))}
function today(){const d=seoulParts();return `${d.year}-${d.month}-${d.day}`}
function nowTime(){const d=seoulParts();return `${d.hour}:${d.minute}`}
function hourBand(t){if(!t)return'';const h=String(t).split(':')[0];return `${Number(h)}시대`}
function daysBetween(a,b){if(!a||!b)return'';const x=new Date(a+'T00:00:00'),y=new Date(b+'T00:00:00');return Math.max(0,Math.round((y-x)/86400000))}
function fee(market,buy,qty,sell){return market==='KR'?(buy*qty*0.0001)+(sell*qty*0.001965):(buy*qty*0.0009)+(sell*qty*0.0009206)}
function tradeProfit(market,buy,qty,sell){const gross=(sell-buy)*qty;const f=fee(market,buy,qty,sell);const profit=gross-f;const rate=buy*qty?profit/(buy*qty)*100:0;return{fee:f,profit,rate}}
function priceForRate(market,buy,qty,targetRate){if(!(buy>0&&qty>0))return 0;let lo=0,hi=buy*5+1000;for(let i=0;i<80;i++){const mid=(lo+hi)/2;const r=tradeProfit(market,buy,qty,mid).rate;if(r>=targetRate)hi=mid;else lo=mid;}return roundSellPrice(market,hi)}
function priceForProfit(market,buy,qty,targetProfit){if(!(buy>0&&qty>0))return 0;let lo=0,hi=buy*5+1000;for(let i=0;i<80;i++){const mid=(lo+hi)/2;const p=tradeProfit(market,buy,qty,mid).profit;if(p>=targetProfit)hi=mid;else lo=mid;}return roundSellPrice(market,hi)}
function roundSellPrice(market,v){return market==='KR'?Math.ceil(v):Math.ceil(v*100)/100}
function openModal(html){document.getElementById('modalCard').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()}
function nextDisplayId(market,ticker){db.displaySeq[market]=(db.displaySeq[market]||0)+1;return `${market}-${(ticker||'TRADE').toUpperCase()}-${String(db.displaySeq[market]).padStart(4,'0')}`}
function activePositions(market){return db.positions.filter(p=>p.market===market&&!p.closed)}
function allBuys(p){return p.events.filter(e=>e.type==='BUY')}
function allSells(p){return p.events.filter(e=>e.type==='SELL')}
function orderedEvents(p){return (p.events||[]).map((e,i)=>({e,i})).sort((a,b)=>{const ad=`${a.e.date||''}T${a.e.time||''}`,bd=`${b.e.date||''}T${b.e.time||''}`;const c=ad.localeCompare(bd);return c||a.i-b.i}).map(x=>x.e)}
function positionState(p){let qty=0,cost=0,avg=0;for(const e of orderedEvents(p)){if(e.type==='BUY'){cost+=n(e.price)*n(e.qty);qty+=n(e.qty);avg=qty?cost/qty:0}else if(e.type==='SELL'){cost-=avg*n(e.qty);qty-=n(e.qty);if(qty<=0){qty=0;cost=0;avg=0}}}return{qty,costBasis:avg*qty,avg}}
function positionAvg(p){let qty=0,cost=0,avg=0;for(const e of orderedEvents(p)){if(e.type==='BUY'){cost+=e.price*e.qty;qty+=e.qty;avg=qty?cost/qty:0}else if(e.type==='SELL'){cost-=avg*e.qty;qty-=e.qty;if(qty<=0){qty=0;cost=0;avg=0}}}return avg}
function investedTotal(p){const s=positionState(p);return s.avg*s.qty}
function renderMarket(market){const el=document.getElementById(market==='KR'?'kr':'us');const positions=activePositions(market);const total=positions.reduce((a,p)=>a+investedTotal(p),0);const isUS=market==='US';el.innerHTML=`
  <div class="card">
    <div class="section-head"><div><h2 style="margin-bottom:3px">${isUS?'미장':'국장'} 보유</h2><div class="note">현재 보유 중인 포지션만 표시합니다.</div></div><button class="btn primary" onclick="newPosition('${market}')">＋ 새 매수</button></div>
    ${isUS?`<div class="desktop-us-exchange exchange-row"><div class="field"><label>현재 환율 (원/USD)</label><input class="input" id="exchangeRate" type="number" value="${db.settings.exchangeRate}" inputmode="decimal"></div><button class="btn" id="exchangeSaveBtn" onclick="saveExchange()">환율 저장</button></div>`:''}
    <div class="summary market-top-summary ${isUS?'desktop-us-summary':''}" style="margin-top:12px">
      <div class="metric big"><div class="k">${isUS?'미장 총 투자액':'국장 총 투자액'}</div><div class="v">${fmt(total,market)}</div></div>
      ${isUS?`<div class="metric"><div class="k">원화 환산</div><div class="v">${fmtKRW(total*db.settings.exchangeRate)}</div></div>`:''}
      <div class="metric"><div class="k">보유 종목</div><div class="v">${positions.length}개</div></div>
    </div>
    ${isUS?`<div class="mobile-only us-mobile-overview"><div class="metric big"><div class="k">미장 총 투자액</div><div class="v">${fmt(total,market)}</div></div><div class="metric"><div class="k">보유 종목</div><div class="v">${positions.length}개</div></div><div class="metric"><div class="k">원화 환산</div><div class="v">${fmtKRW(total*db.settings.exchangeRate)}</div></div><div class="metric"><div class="exchange-row"><div class="field"><label>현재 환율 (원/USD)</label><input class="input" id="exchangeRateMobile" type="number" value="${db.settings.exchangeRate}" inputmode="decimal" placeholder="환율 입력"></div><button class="btn" id="exchangeSaveBtnMobile" onclick="saveExchange(true)">저장</button></div></div></div>`:''}
  </div>
  <div id="${market}List">${positions.length?positions.map(positionCard).join(''):`<div class="card"><div class="note">현재 보유 종목이 없습니다.</div></div>`}</div>`;
}
function positionCard(p){const s=positionState(p);const preset={name:p.presetName||p.presetSnapshot?.name||'직접설정',target:p.target,stop:p.stop};const target=priceForRate(p.market,s.avg,s.qty,p.target);const breakeven=priceForProfit(p.market,s.avg,s.qty,p.market==='KR'?db.settings.krMinProfit:db.settings.usMinProfit);const stop=priceForRate(p.market,s.avg,s.qty,p.stop);const ex=db.settings.exchangeRate;return `<div class="position">

  </div>
  <div class="quick"><div class="field sim-price"><label>전량 매도가</label><input class="input" id="sim-${p.id}" type="number" step="${p.market==='KR'?1:0.01}" placeholder="가격" value="${p.savedSimPrice??''}" oninput="autoSaveSimPrice('${p.id}')"></div><div id="simout-${p.id}" class="note sim-result">가격 입력 → 예상 순이익</div></div>
  <div class="trade-actions"><button class="btn buy" onclick="addBuy('${p.id}')">매수</button><button class="btn sell" onclick="sellPosition('${p.id}')">매도</button><button class="btn" onclick="editPosition('${p.id}')">수정</button><button class="btn" id="detailBtn-${p.id}" onclick="toggleDetail('${p.id}')">내역 ▾</button></div>
  <div class="detail hidden" id="detail-${p.id}">${renderEventHistory(p)}</div>
</div>`}

function recalcPosition(p){let qty=0,cost=0,avg=0,cum=0,buySeq=0,sellSeq=0,invalid=false;for(const e of orderedEvents(p)){if(e.type==='BUY'){buySeq++;e.seq=buySeq;e.beforeAvg=avg;e.beforeQty=qty;cost+=n(e.price)*n(e.qty);qty+=n(e.qty);avg=qty?cost/qty:0;e.afterAvg=avg;e.afterQty=qty;e.hourBand=hourBand(e.time)}else{sellSeq++;e.seq=sellSeq;e.beforeAvg=avg;e.beforeQty=qty;const q=n(e.qty);const r=tradeProfit(p.market,avg,q,n(e.price));if(q>qty)invalid=true;qty=Math.max(0,qty-q);cost=Math.max(0,cost-avg*q);if(qty===0){cost=0;avg=0}e.afterAvg=avg;e.afterQty=qty;e.fee=r.fee;e.profit=r.profit;e.profitRate=r.rate;cum+=r.profit;e.cumulativeProfit=cum;e.hourBand=hourBand(e.time);if(p.market==='US'){const fx=n(e.exchangeRate);e.profitKRW=r.profit*fx;e.after22=r.profit>0?r.profit*.78:r.profit;e.after22KRW=e.after22*fx}}}p.closed=qty<=0&&p.events.some(e=>e.type==='SELL');p.closedAt=p.closed?[...p.events].reverse().find(e=>e.type==='SELL')?.date||'':null;return{qty,avg,costBasis:avg*qty,invalid}}

window.exportMD=()=>{
  if(!db.positions.length){alert('내보낼 기록이 없습니다.');return}
  let md=`# 주식 매매 기록\n\n생성일: ${today()}\n\n`;
  const groups={};
  for(const p of db.positions){const k=(p.closedAt||allBuys(p)[0]?.date||today()).slice(0,7);(groups[k]=groups[k]||[]).push(p)}
  for(const month of Object.keys(groups).sort().reverse()){
    md+=`## ${month}\n\n`;
    for(const p of groups[month]){
      const buys=allBuys(p),sells=allSells(p),profit=sells.reduce((a,e)=>a+(e.profit||0),0);
      const firstBuy=buys[0];
      const lastEvent=p.events[p.events.length-1];
      md+=`### ${p.name}${p.ticker?` (${p.ticker})`:''}\n\n`;
      md+=`- 거래ID: ${p.displayId}\n`;
      md+=`- 시장: ${p.market==='KR'?'국장':'미장'}\n`;
      md+=`- 상태: ${p.closed?'종료':'진행중'}\n`;
      md+=`- 프리셋: ${p.presetName||p.presetSnapshot?.name||'직접설정'}\n`;
      md+=`- 목표 / 손절: ${pct(p.target)} / ${pct(p.stop)}\n`;
      if(firstBuy&&lastEvent)md+=`- 기록 기간: ${firstBuy.date} ~ ${lastEvent.date} · ${daysBetween(firstBuy.date,lastEvent.date)}일\n`;
      md+=`- 누적 실현손익: ${fmt(profit,p.market)}\n`;
      if(p.tradeMemo)md+=`- 거래 전체 메모: ${p.tradeMemo}\n`;
      md+='\n#### 매매 내역\n\n';
      for(const e of p.events){
        const kind=e.type==='BUY'?'매수':'매도';
        md+=`**${kind} ${e.seq}차 · ${e.date}${e.time?` ${e.time}`:''}**\n\n`;
        md+=`- 가격: ${fmt(e.price,p.market)}\n`;
        md+=`- 수량: ${e.qty}주\n`;
        md+=`- 거래금액: ${fmt(e.price*e.qty,p.market)}\n`;
        if(e.beforeAvg!==undefined&&e.beforeAvg!=='')md+=`- 거래 전 평단: ${fmt(e.beforeAvg,p.market)}\n`;
        if(e.afterAvg!==undefined&&e.afterAvg!=='')md+=`- 거래 후 평단: ${fmt(e.afterAvg,p.market)}\n`;
        if((e.tags||[]).length)md+=`- 태그: ${(e.tags||[]).join(' · ')}\n`;
        if(e.memo)md+=`- 메모: ${e.memo}\n`;
        if(e.type==='SELL'){
          if(e.rule)md+=`- 원칙 상태: ${e.rule}\n`;
          if(e.profit!==undefined&&e.profit!=='')md+=`- 이번 순이익: ${fmt(e.profit,p.market)} (${pct(e.profitRate||0)})\n`;
          if(e.cumulativeProfit!==undefined&&e.cumulativeProfit!=='')md+=`- 누적 순이익: ${fmt(e.cumulativeProfit,p.market)}\n`;
          if(p.market==='US'&&e.exchangeRate)md+=`- 매도 당시 환율: ${Math.round(Number(e.exchangeRate))}원\n`;
          if(p.market==='US'&&e.profitKRW!==undefined&&e.profitKRW!=='')md+=`- 순이익 원화 환산: ${fmtKRW(e.profitKRW)}\n`;
        }
        md+='\n';
      }
      md+='---\n\n';
    }
  }
  download(`주식매매_읽기용_${today()}.md`,md,'text/markdown;charset=utf-8')
}

function download(name,content,type){const b=new Blob([content],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function renderWatering(){const el=document.getElementById('watering');el.innerHTML=`<div class="card"><div class="section-head"><div><h2 style="margin-bottom:0">물타기 계산</h2></div><button class="btn" style="white-space:nowrap;min-width:96px" onclick="openHoldingPicker()">불러오기</button></div><div class="grid"><div class="field"><label>종목명</label><input class="input" id="wName"></div><div class="field"><label>시장</label><div class="market-toggle"><button class="btn on" id="wMarketKR" onclick="setWaterMarket('KR')">국장</button><button class="btn" id="wMarketUS" onclick="setWaterMarket('US')">미장</button></div><input type="hidden" id="wMarket" value="KR"></div><div class="field"><label>현재 평단</label><input class="input" id="wAvg" type="number"></div><div class="field"><label>현재 수량</label><input class="input" id="wQty" type="number"></div></div></div>
<div class="watering-modes"><div class="watering-box"><h3>① 매수가 + 수량</h3><div class="field"><label>추가 매수가</label><input class="input wcalc" id="w1p" type="number"></div><div class="field" style="margin-top:8px"><label>추가 수량</label><input class="input wcalc" id="w1q" type="number"></div><div class="note" id="w1out" style="margin-top:10px">입력 즉시 계산</div><button class="btn primary" style="margin-top:10px;width:100%" onclick="saveWateringMode(1)">① 이 계산 저장</button></div><div class="watering-box"><h3>② 매수가 + 목표 평단</h3><div class="field"><label>추가 매수가</label><input class="input wcalc" id="w2p" type="number"></div><div class="field" style="margin-top:8px"><label>목표 평단</label><input class="input wcalc" id="w2a" type="number"></div><div class="note" id="w2out" style="margin-top:10px">필요 수량 계산</div><button class="btn primary" style="margin-top:10px;width:100%" onclick="saveWateringMode(2)">② 이 계산 저장</button></div><div class="watering-box"><h3>③ 매수가 + 예산</h3><div class="field"><label>추가 매수가</label><input class="input wcalc" id="w3p" type="number"></div><div class="field" style="margin-top:8px"><label>예산</label><input class="input wcalc" id="w3b" type="number"></div><div class="note" id="w3out" style="margin-top:10px">가능 수량과 새 평단 계산</div><button class="btn primary" style="margin-top:10px;width:100%" onclick="saveWateringMode(3)">③ 이 계산 저장</button></div></div>
<div class="card"><h3>임시 저장</h3><div id="wateringSaved" class="watering-saved-grid" style="margin-top:12px">${renderWateringSaved()}</div></div>`;document.querySelectorAll('.wcalc,#wAvg,#wQty,#wName').forEach(x=>x.addEventListener('input',calcWatering));calcWatering()}
window.setWaterMarket=market=>{const hidden=document.getElementById('wMarket');if(!hidden)return;hidden.value=market;document.getElementById('wMarketKR')?.classList.toggle('on',market==='KR');document.getElementById('wMarketUS')?.classList.toggle('on',market==='US');calcWatering()}
window.openHoldingPicker=()=>{const ps=db.positions.filter(p=>!p.closed&&positionState(p).qty>0);if(!ps.length){alert('현재 보유 중인 종목이 없습니다.');return}openModal(`<div class="section-head"><h2>보유종목 불러오기</h2><button class="btn" onclick="closeModal()">닫기</button></div><div class="note">종목명·현재 평단·현재 수량만 물타기 계산기로 가져옵니다. 실제 보유기록은 변경되지 않습니다.</div><div style="margin-top:12px">${ps.map(p=>{const st=positionState(p);return `<button class="btn" style="width:100%;height:auto;padding:12px;text-align:left;margin-bottom:8px" onclick="loadHoldingToWatering('${p.id}')"><b style="color:#047857">${esc(p.name)}</b>${p.ticker?` <span class="muted">${esc(p.ticker)}</span>`:''}<br><span class="tiny">${p.market==='KR'?'국장':'미장'} · 평단 ${fmt(st.avg,p.market)} · ${st.qty}주</span></button>`}).join('')}</div>`)}

function calcWatering(){if(!document.getElementById('wAvg'))return;const market=document.getElementById('wMarket').value,avg=n(document.getElementById('wAvg').value),qty=n(document.getElementById('wQty').value),cost=avg*qty,f=v=>fmt(v,market),name=document.getElementById('wName').value.trim();let results={};const p1=n(document.getElementById('w1p').value),q1=n(document.getElementById('w1q').value);if(avg>0&&qty>0&&p1>0&&q1>0){const nq=qty+q1,na=(cost+p1*q1)/nq;results[1]={mode:1,price:p1,qty:q1,newQty:nq,newAvg:na};document.getElementById('w1out').innerHTML=`새 평단 <b>${f(na)}</b> · 총 ${nq}주 · 추가금 ${f(p1*q1)}`}else document.getElementById('w1out').textContent='입력 즉시 계산';const p2=n(document.getElementById('w2p').value),a2=n(document.getElementById('w2a').value);if(avg>0&&qty>0&&p2>0&&a2>0){if((p2<a2&&a2<avg)||(p2>a2&&a2>avg)){const exact=(avg*qty-a2*qty)/(a2-p2),need=Math.ceil(exact);if(need>0){const na=(cost+p2*need)/(qty+need);results[2]={mode:2,price:p2,targetAvg:a2,qty:need,newQty:qty+need,newAvg:na};document.getElementById('w2out').innerHTML=`필요 <b>${need}주</b> · 예상 사용 ${f(p2*need)} · 계산 후 평단 ${f(na)}`}else document.getElementById('w2out').textContent='목표 평단을 확인해주세요.'}else document.getElementById('w2out').textContent='목표 평단은 현재 평단과 추가 매수가 사이여야 합니다.'}else document.getElementById('w2out').textContent='필요 수량 계산';const p3=n(document.getElementById('w3p').value),b3=n(document.getElementById('w3b').value);if(avg>0&&qty>0&&p3>0&&b3>0){const aq=Math.floor(b3/p3);if(aq>0){const na=(cost+p3*aq)/(qty+aq);results[3]={mode:3,price:p3,budget:b3,qty:aq,newQty:qty+aq,newAvg:na};document.getElementById('w3out').innerHTML=`가능 <b>${aq}주</b> · 새 평단 ${f(na)} · 실제 사용 ${f(p3*aq)}`}else document.getElementById('w3out').textContent='예산으로 1주 이상 살 수 없습니다.'}else document.getElementById('w3out').textContent='가능 수량과 새 평단 계산';window.currentWatering={market,avg,qty,name,results}}
window.saveWateringMode=mode=>{calcWatering();const w=window.currentWatering,r=w?.results?.[mode];if(!r){alert(`${mode}번 계산에 필요한 값을 먼저 입력해주세요.`);return}if(db.wateringPlans.length>=10){alert('임시 저장은 최대 10개입니다. 먼저 하나를 삭제해주세요.');return}db.wateringPlans.unshift({id:crypto.randomUUID(),savedAt:new Date().toISOString(),market:w.market,avg:w.avg,qty:w.qty,name:w.name,result:{...r}});save();document.getElementById('wateringSaved').innerHTML=renderWateringSaved()}
function renderWateringSaved(){if(!db.wateringPlans.length)return '<div class="note">저장된 물타기 계산이 없습니다.</div>';const labels={1:'① 수량 기준',2:'② 목표평단 기준',3:'③ 예산 기준'};return db.wateringPlans.map(x=>`<div class="saved-plan"><button class="saved-plan-x" title="삭제" aria-label="삭제" onclick="deleteWatering('${x.id}')">×</button><b>${esc(x.name||'이름 없음')} · ${x.market==='KR'?'국장':'미장'} · ${labels[x.result.mode]||''}</b><div class="note">현재 ${fmt(x.avg,x.market)} × ${x.qty}주 → ${fmt(x.result.price,x.market)}에 ${x.result.qty}주 추가 → 새 평단 <b>${fmt(x.result.newAvg,x.market)}</b></div></div>`).join('')}

ge="selectAIPrompt()">${prompts.map(x=>`<option value="${x.id}" ${x.id===db.settings.aiSelectedPromptId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div id="aiPromptBody" style="margin-top:10px"></div>`:`<div class="note">저장된 프롬프트가 없습니다. ＋ 추가로 프롬프트를 만들어주세요.</div>`}</div>`;renderAIPromptBody()}

window.editAIPrompt=id=>{const p=(db.aiPrompts||[]).find(x=>x.id===id);if(!p)return;openModal(`<div class="section-head"><h2>프롬프트 수정</h2><button class="btn" onclick="closeModal()">닫기</button></div><div class="field"><label>프리셋 이름</label><input class="input" id="apName" value="${esc(p.name)}"></div><div class="field" style="margin-top:10px"><label>설명</label><input class="input" id="apDesc" value="${esc(p.description||'')}"></div><div class="field" style="margin-top:10px"><label>프롬프트 본문</label><textarea class="textarea" id="apText" style="min-height:300px">${esc(p.text)}</textarea></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="saveEditAIPrompt('${id}')">저장</button></div>`) };
window.saveEditAIPrompt=id=>{const p=(db.aiPrompts||[]).find(x=>x.id===id);if(!p)return;const name=document.getElementById('apName').value.trim(),description=document.getElementById('apDesc').value.trim(),text=document.getElementById('apText').value.trim();if(!name||!text){alert('이름과 프롬프트를 입력해주세요.');return}p.name=name;p.description=description;p.text=text;save();closeModal();renderAI()};
window.deleteAIPrompt=id=>{if(!confirm('이 프롬프트를 삭제할까요?'))return;db.aiPrompts=(db.aiPrompts||[]).filter(x=>x.id!==id);if(db.settings.aiSelectedPromptId===id)db.settings.aiSelectedPromptId=db.aiPrompts[0]?.id||'';save();renderAI()};
window.saveAIHoldingSelection=()=>{db.settings.aiSelectedHoldingIds=[...document.querySelectorAll('.aiHolding:checked')].map(x=>x.value);save();buildAICopy()};
window.saveAIExtraStocks=()=>{const el=document.getElementById('aiExtraStocks');if(!el)return;db.settings.aiExtraStocks=el.value;save();buildAICopy()};
window.toggleAIExtraStocks=()=>{const el=document.getElementById('aiExtraEnabled');db.settings.aiExtraEnabled=!!el?.checked;save();buildAICopy()};
window.buildAICopy=()=>{const out=document.getElementById('aiCopyText'),sel=document.getElementById('aiPromptSelect');if(!out)return;const selectedPromptId=sel?.value||db.settings.aiSelectedPromptId||'';const p=(db.aiPrompts||[]).find(x=>x.id===selectedPromptId);const ids=document.querySelectorAll('.aiHolding').length?[...document.querySelectorAll('.aiHolding:checked')].map(x=>x.value):(db.settings.aiSelectedHoldingIds||[]);const info=ids.map(id=>{const x=db.positions.find(p=>p.id===id);if(!x||x.closed)return'';const st=positionState(x);return `- 종목명: ${x.name}${x.ticker?` (${x.ticker})`:''}\n  시장: ${x.market==='KR'?'국장':'미장'}\n  현재 평단: ${fmt(st.avg,x.market)}\n  현재 수량: ${st.qty}주`}).filter(Boolean).join('\n');const extraEnabled=document.getElementById('aiExtraEnabled')?.checked??!!db.settings.aiExtraEnabled;const extra=extraEnabled?(document.getElementById('aiExtraStocks')?.value??db.settings.aiExtraStocks??'').trim():'';let parts=[];if(p)parts.push(p.text);if(info)parts.push(`--- 선택한 보유종목 정보 ---\n${info}`);if(extra)parts.push(`--- 추가 관심종목 ---\n${extra}`);out.value=parts.join('\n\n')};
window.copyAIText=async()=>{const out=document.getElementById('aiCopyText');if(!out||!out.value){alert('복사할 내용을 먼저 만들어주세요.');return}try{await navigator.clipboard.writeText(out.value);alert('복사했습니다.')}catch(e){out.select();document.execCommand('copy');alert('복사했습니다.')}};
function renderSettings(){openModal(`<div class="section-head"><h2>설정</h2><button class="btn" onclick="closeModal()">닫기</button></div><div class="grid"><div class="field"><label>국장 최소 순익 기준</label><input class="input" id="stKR" type="number" value="${db.settings.krMinProfit}" oninput="autoSaveSettings()"></div><div class="field"><label>미장 최소 순익 기준 ($)</label><input class="input" id="stUS" type="number" value="${db.settings.usMinProfit}" oninput="autoSaveSettings()"></div></div><div class="settings-group"><h3>프리셋</h3><div id="presetEditor">${db.presets.map((p,i)=>`<div class="grid3" style="margin-bottom:8px"><input class="input spName" data-i="${i}" value="${esc(p.name)}" oninput="autoSaveSettings()"><input class="input spTarget" data-i="${i}" type="number" step="0.1" value="${p.target}" oninput="autoSaveSettings()"><div style="display:flex;gap:6px"><input class="input spStop" data-i="${i}" type="number" step="0.1" value="${p.stop}" oninput="autoSaveSettings()"><button class="btn danger nowrap-delete" onclick="removePreset(${i})">삭제</button></div></div>`).join('')}</div><button class="btn" onclick="addPresetRow()">＋ 프리셋 추가</button></div><div class="settings-group"><h3>진입 이유 태그</h3><div id="tagEditor">${db.tags.map((t,i)=>`<div style="display:flex;gap:6px;margin-bottom:7px"><input class="input tagName" data-i="${i}" value="${esc(t)}" oninput="autoSaveSettings()"><button class="btn danger nowrap-delete" onclick="removeTag(${i})">삭제</button></div>`).join('')}</div><button class="btn" onclick="addTagRow()">＋ 태그 추가</button></div><div class="note" style="margin-top:14px">변경 내용은 입력 즉시 자동 저장됩니다.</div>`)}
window.autoSaveSettings=()=>{const kr=document.getElementById('stKR'),us=document.getElementById('stUS');if(kr)db.settings.krMinProfit=Math.max(0,n(kr.value));if(us)db.settings.usMinProfit=Math.max(0,n(us.value));const names=[...document.querySelectorAll('.spName')],targets=[...document.querySelectorAll('.spTarget')],stops=[...document.querySelectorAll('.spStop')];if(names.length)db.presets=names.map((x,i)=>({id:db.presets[i]?.id||crypto.randomUUID(),name:x.value.trim()||`프리셋${i+1}`,target:n(targets[i]?.value),stop:n(stops[i]?.value)}));const tags=[...document.querySelectorAll('.tagName')];if(tags.length)db.tags=tags.map(x=>x.value.trim()).filter(Boolean);save()}
window.removePreset=i=>{document.querySelectorAll('.spName,.spTarget,.spStop').forEach(()=>{});db.presets.splice(i,1);save();renderSettings()}
window.addPresetRow=()=>{db.presets.push({id:crypto.randomUUID(),name:'새 프리셋',target:2,stop:-1.5});save();renderSettings()}
window.removeTag=i=>{db.tags.splice(i,1);save();renderSettings()}
window.addTagRow=()=>{db.tags.push('새 태그');save();renderSettings()}
window.resetAllData=()=>{if(!confirm('정말 전체 데이터를 초기화할까요?\n\n현재 보유 종목, 매매기록, 프리셋, 태그, 메모, 환율, 물타기 임시저장이 모두 삭제됩니다.\n필요하면 먼저 JSON 전체 백업을 저장해주세요.'))return;const typed=prompt('실수 방지를 위해 초기화 라고 입력해주세요.');if(typed!=='초기화'){alert('초기화를 취소했습니다.');return}localStorage.removeItem(KEY);localStorage.removeItem(OLD_KEY);db=freshDB();save();closeModal();renderAll();alert('전체 데이터가 초기화되었습니다.')}
document.getElementById('openSettings').onclick=renderSettings;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab));if(b.dataset.tab==='history')renderHistory();if(b.dataset.tab==='watering')renderWatering();if(b.dataset.tab==='ai')renderAI()});

if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
function renderAll(){for(const p of db.positions)recalcPosition(p);renderMarket('KR');renderMarket('US');renderHistory();renderWatering();renderAI();setTimeout(()=>{for(const p of db.positions){if(p.savedSimPrice)simulateSell(p.id)}},0)}
initDB().then(()=>renderAll()).catch(e=>{console.error(e);alert('데이터를 불러오지 못했습니다.')});
</script>
</body>
</html>
