<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>주식 매매 관리</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#18202a;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--accent2:#eff6ff;--danger:#dc2626;--good:#15803d;--warn:#b45309;--shadow:0 10px 30px rgba(20,30,50,.07);--r:18px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:1080px;margin:auto;padding:18px 14px 44px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin:4px 0 14px}.top h1{margin:0;font-size:28px;letter-spacing:-1.2px}.sub{font-size:13px;color:var(--muted);margin-top:4px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:#e9edf2;padding:4px;border-radius:14px;position:sticky;top:0;z-index:10}.tab{padding:11px 8px;border-radius:10px;background:transparent;color:#596270;font-weight:800}.tab.active{background:#fff;color:var(--text);box-shadow:0 2px 8px #0000000d}.page{display:none;margin-top:14px}.page.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}.card h2,.card h3{margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:0 0 6px}.input,.select,.textarea{width:100%;border:1px solid #d9dee6;border-radius:12px;background:#fff;outline:0}.input,.select{height:46px;padding:0 12px}.textarea{min-height:88px;padding:10px 12px;resize:vertical}.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #2563eb18}.btn{min-height:42px;padding:0 14px;border-radius:12px;background:#eef2f7;color:#26303c;font-weight:800}.btn.primary{background:var(--accent);color:#fff}.btn.good{background:#ecfdf3;color:var(--good)}.btn.danger{background:#fef2f2;color:var(--danger)}.actions{display:flex;gap:8px;flex-wrap:wrap}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#f8fafc;border-radius:14px;padding:13px}.metric .k{font-size:11px;color:var(--muted);font-weight:800}.metric .v{font-size:19px;font-weight:900;margin-top:5px;letter-spacing:-.4px}.metric.big{background:#111827;color:#fff}.metric.big .k{color:#cbd5e1}.metric.good .v{color:var(--good)}.metric.danger .v{color:var(--danger)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.position{border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:10px;background:#fff}.position-title{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.name{font-size:18px;font-weight:900;color:#047857}.muted{color:var(--muted);font-size:12px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#eef2ff;color:#3730a3}.badge.closed{background:#f1f5f9;color:#64748b}.price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.price-box{padding:11px;border-radius:12px;background:#f8fafc}.price-box .k{font-size:11px;color:var(--muted);font-weight:800}.price-box .v{font-size:17px;font-weight:900;margin-top:4px}.price-box.target{background:#fef2f2}.price-box.target .v{color:#dc2626}.price-box.breakeven{background:#f0fdf4}.price-box.stop{background:#eff6ff}.price-box.stop .v{color:#2563eb}.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end;margin-top:10px}.detail{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.event{display:grid;grid-template-columns:85px 1fr 90px 70px;gap:8px;padding:7px 0;border-bottom:1px solid #f1f5f9;font-size:12px}.event:last-child{border-bottom:0}.note{font-size:12px;line-height:1.55;color:var(--muted)}.exchange-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:8px 11px;border-radius:999px;background:#f1f5f9;font-size:12px;font-weight:800}.chip.on{background:#111827;color:#fff}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:8px;border-bottom:1px solid #eef2f7;white-space:nowrap;text-align:left}.table th{color:var(--muted)}.watering-modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.watering-box{border:1px solid var(--line);border-radius:14px;padding:14px}.saved-plan{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}.settings-group{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.tiny{font-size:11px;color:var(--muted)}.hidden{display:none!important}.trade-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.trade-actions .btn{padding:0 8px;white-space:nowrap}.btn.buy{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}.btn.sell{background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe}.market-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px}.market-toggle .btn.on{background:#111827;color:#fff}.save-flash{animation:savePulse .5s ease}@keyframes savePulse{0%{transform:scale(1)}45%{transform:scale(.96)}100%{transform:scale(1)}}
@media(max-width:760px){.top{display:block}.tabs{margin-top:12px}.grid3,.watering-modes{grid-template-columns:1fr}.summary,.price-grid{grid-template-columns:1fr 1fr}.summary .metric:first-child{grid-column:1/-1}.event{grid-template-columns:72px 1fr}.event>*:nth-child(n+3){text-align:left}.quick,.exchange-row{grid-template-columns:1fr}.actions .btn{flex:1}.position-title{align-items:center}}
@media(max-width:460px){.app{padding:12px 10px 32px}.top h1{font-size:24px}.tab{font-size:12px;padding:10px 5px}.grid,.summary,.price-grid{grid-template-columns:1fr}.summary .metric:first-child{grid-column:auto}.card{padding:14px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>주식 매매 관리</h1><div class="sub">주식 매매 기록 & 물타기 시뮬레이터</div></div>
    <div class="actions"><button class="btn hidden" id="installBtn">앱 설치</button><button class="btn" id="openSettings">설정</button></div>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="kr">국장</button>
    <button class="tab" data-tab="us">미장</button>
    <button class="tab" data-tab="history">매매기록</button>
    <button class="tab" data-tab="watering">물타기</button>
  </div>

  <section id="kr" class="page active"></section>
  <section id="us" class="page"></section>
  <section id="history" class="page"></section>
  <section id="watering" class="page"></section>
</div>

<div id="modal" class="hidden" style="position:fixed;inset:0;background:#0008;z-index:30;padding:16px;overflow:auto">
  <div class="card" style="max-width:760px;margin:28px auto" id="modalCard"></div>
</div>

<script>
const KEY='stock_manager_v2';
const OLD_KEY='stock_manager_v1';
const DEFAULT_PRESETS=[
  {id:crypto.randomUUID(),name:'초단타',target:1.0,stop:-0.7},
  {id:crypto.randomUUID(),name:'단타',target:2.0,stop:-1.5},
  {id:crypto.randomUUID(),name:'여유단타',target:3.0,stop:-2.0},
  {id:crypto.randomUUID(),name:'스윙',target:5.0,stop:-3.0},
  {id:crypto.randomUUID(),name:'장기보유',target:15.0,stop:-8.0}
];
const DEFAULT_TAGS=['뉴스/이슈','실적 기대','실적 발표 후','돌파','눌림목','반등 기대','과매도 판단','추세 추종','지지선 진입','분할매수','물타기','단타 연습','스윙 진입','충동매수','기타'];
function freshDB(){return {version:2,positions:[],presets:DEFAULT_PRESETS.map(p=>({...p,id:crypto.randomUUID()})),tags:[...DEFAULT_TAGS],settings:{krMinProfit:1000,usMinProfit:1,exchangeRate:1400},wateringPlans:[],displaySeq:{KR:0,US:0}}}
let db=loadDB();
function loadDB(){
  for(const key of [KEY,OLD_KEY]){try{const x=JSON.parse(localStorage.getItem(key));if(x&&x.version){x.version=2;x.positions=x.positions||[];x.presets=x.presets||freshDB().presets;x.tags=x.tags||[...DEFAULT_TAGS];x.settings=Object.assign({krMinProfit:1000,usMinProfit:1,exchangeRate:1400},x.settings||{});x.wateringPlans=x.wateringPlans||[];x.displaySeq=x.displaySeq||{KR:0,US:0};for(const p of x.positions){p.tradeMemo=p.tradeMemo||'';if(p.presetSnapshot&&!p.presetName)p.presetName=p.presetSnapshot.name||'직접설정';if(!p.presetName)p.presetName='직접설정';delete p.settingChanges;}return x}}catch(e){}}
  return freshDB();
}
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function n(v){const x=Number(v);return Number.isFinite(x)?x:0}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(v,market='KR'){if(!Number.isFinite(Number(v)))return '-';const x=Number(v);return market==='US'?'$'+new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(x):'₩'+new Intl.NumberFormat('ko-KR',{maximumFractionDigits:0}).format(Math.round(x))}
function pct(v){return (Number(v)>=0?'+':'')+Number(v).toFixed(2)+'%'}
function fmtKRW(v){return '₩'+new Intl.NumberFormat('ko-KR',{maximumFractionDigits:0}).format(Math.round(Number(v)||0))}
function seoulParts(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());return Object.fromEntries(parts.map(x=>[x.type,x.value]))}
function today(){const d=seoulParts();return `${d.year}-${d.month}-${d.day}`}
function nowTime(){const d=seoulParts();return `${d.hour}:${d.minute}`}
function hourBand(t){if(!t)return'';const h=String(t).split(':')[0];return `${Number(h)}시대`}
function daysBetween(a,b){if(!a||!b)return'';const x=new Date(a+'T00:00:00'),y=new Date(b+'T00:00:00');return Math.max(0,Math.round((y-x)/86400000))}
function fee(market,buy,qty,sell){return market==='KR'?(buy*qty*0.0001)+(sell*qty*0.001965):(buy*qty*0.0009)+(sell*qty*0.0009206)}
function tradeProfit(market,buy,qty,sell){const gross=(sell-buy)*qty;const f=fee(market,buy,qty,sell);const profit=gross-f;const rate=buy*qty?profit/(buy*qty)*100:0;return{fee:f,profit,rate}}
function priceForRate(market,buy,qty,targetRate){if(!(buy>0&&qty>0))return 0;let lo=0,hi=buy*5+1000;for(let i=0;i<80;i++){const mid=(lo+hi)/2;const r=tradeProfit(market,buy,qty,mid).rate;if(r>=targetRate)hi=mid;else lo=mid;}return roundSellPrice(market,hi)}
function priceForProfit(market,buy,qty,targetProfit){if(!(buy>0&&qty>0))return 0;let lo=0,hi=buy*5+1000;for(let i=0;i<80;i++){const mid=(lo+hi)/2;const p=tradeProfit(market,buy,qty,mid).profit;if(p>=targetProfit)hi=mid;else lo=mid;}return roundSellPrice(market,hi)}
function roundSellPrice(market,v){return market==='KR'?Math.ceil(v):Math.ceil(v*100)/100}
function openModal(html){document.getElementById('modalCard').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()}
function nextDisplayId(market,ticker){db.displaySeq[market]=(db.displaySeq[market]||0)+1;return `${market}-${(ticker||'TRADE').toUpperCase()}-${String(db.displaySeq[market]).padStart(4,'0')}`}
function activePositions(market){return db.positions.filter(p=>p.market===market&&!p.closed)}
function allBuys(p){return p.events.filter(e=>e.type==='BUY')}
function allSells(p){return p.events.filter(e=>e.type==='SELL')}
function positionState(p){let qty=0,cost=0,avg=0;for(const e of p.events){if(e.type==='BUY'){cost+=n(e.price)*n(e.qty);qty+=n(e.qty);avg=qty?cost/qty:0}else if(e.type==='SELL'){cost-=avg*n(e.qty);qty-=n(e.qty);if(qty<=0){qty=0;cost=0;avg=0}}}return{qty,costBasis:avg*qty,avg}}
function positionAvg(p){let qty=0,cost=0,avg=0;for(const e of p.events){if(e.type==='BUY'){cost+=e.price*e.qty;qty+=e.qty;avg=qty?cost/qty:0}else if(e.type==='SELL'){cost-=avg*e.qty;qty-=e.qty;if(qty<=0){qty=0;cost=0;avg=0}}}return avg}
function investedTotal(p){const s=positionState(p);return s.avg*s.qty}
function renderMarket(market){const el=document.getElementById(market==='KR'?'kr':'us');const positions=activePositions(market);const total=positions.reduce((a,p)=>a+investedTotal(p),0);const isUS=market==='US';el.innerHTML=`
  <div class="card">
    <div class="section-head"><div><h2 style="margin-bottom:3px">${isUS?'미장':'국장'} 보유</h2><div class="note">현재 보유 중인 포지션만 표시합니다.</div></div><button class="btn primary" onclick="newPosition('${market}')">＋ 새 매수</button></div>
    ${isUS?`<div class="exchange-row"><div class="field"><label>현재 환율 (원/USD)</label><input class="input" id="exchangeRate" type="number" value="${db.settings.exchangeRate}" inputmode="decimal"></div><button class="btn" id="exchangeSaveBtn" onclick="saveExchange()">환율 저장</button></div>`:''}
    <div class="summary" style="margin-top:12px">
      <div class="metric big"><div class="k">${isUS?'미장 총 투자액':'국장 총 투자액'}</div><div class="v">${fmt(total,market)}</div></div>
      ${isUS?`<div class="metric"><div class="k">원화 환산</div><div class="v">${fmtKRW(total*db.settings.exchangeRate)}</div></div>`:''}
      <div class="metric"><div class="k">보유 종목</div><div class="v">${positions.length}개</div></div>
    </div>
  </div>
  <div id="${market}List">${positions.length?positions.map(positionCard).join(''):`<div class="card"><div class="note">현재 보유 종목이 없습니다.</div></div>`}</div>`;
}
function positionCard(p){const s=positionState(p);const preset={name:p.presetName||p.presetSnapshot?.name||'직접설정',target:p.target,stop:p.stop};const target=priceForRate(p.market,s.avg,s.qty,p.target);const breakeven=priceForProfit(p.market,s.avg,s.qty,p.market==='KR'?db.settings.krMinProfit:db.settings.usMinProfit);const stop=priceForRate(p.market,s.avg,s.qty,p.stop);const ex=db.settings.exchangeRate;return `<div class="position">
  <div class="position-title"><div><div class="name">${esc(p.name)} ${p.ticker?`<span class="muted">${esc(p.ticker)}</span>`:''}</div><div class="muted">${esc(p.displayId)} · ${esc(preset.name)} · 매수 ${allBuys(p).length}회 / 매도 ${allSells(p).length}회</div></div><span class="badge">보유중</span></div>
  <div class="summary" style="margin-top:10px"><div class="metric"><div class="k">현재 평단</div><div class="v">${fmt(s.avg,p.market)}</div></div><div class="metric"><div class="k">보유수량</div><div class="v">${s.qty}주</div></div><div class="metric"><div class="k">총 투자액</div><div class="v">${fmt(s.avg*s.qty,p.market)}${p.market==='US'?`<div class="tiny">≈ ${fmtKRW(s.avg*s.qty*ex)}</div>`:''}</div></div></div>
  <div class="price-grid"><div class="price-box target"><div class="k">목표 ${pct(p.target)}</div><div class="v">${fmt(target,p.market)}</div></div><div class="price-box breakeven"><div class="k">최소 순익 ${p.market==='KR'?fmt(db.settings.krMinProfit,'KR'):fmt(db.settings.usMinProfit,'US')}</div><div class="v">${fmt(breakeven,p.market)}</div></div><div class="price-box stop"><div class="k">손절 ${pct(p.stop)}</div><div class="v">${fmt(stop,p.market)}</div></div></div>
  <div class="quick"><div class="field"><label>이 가격에 전량 팔면?</label><input class="input" id="sim-${p.id}" type="number" step="${p.market==='KR'?1:0.01}" placeholder="예상 매도가" oninput="simulateSell('${p.id}')"></div><div id="simout-${p.id}" class="note">가격을 입력하면 예상 순이익을 표시합니다.</div></div>
  <div class="trade-actions"><button class="btn buy" onclick="addBuy('${p.id}')">매수</button><button class="btn sell" onclick="sellPosition('${p.id}')">매도</button><button class="btn" onclick="editPosition('${p.id}')">수정</button><button class="btn" id="detailBtn-${p.id}" onclick="toggleDetail('${p.id}')">내역 ▾</button></div>
  <div class="detail hidden" id="detail-${p.id}">${renderEventHistory(p)}</div>
</div>`}
function renderEventHistory(p){return p.events.map(e=>`<div class="event"><span>${e.date}<br>${e.time||''}</span><span><b>${e.type==='BUY'?'매수':'매도'} ${e.seq}차</b><br>${esc(e.memo||'')}${(e.tags||[]).length?`<br><span class="tiny">${esc((e.tags||[]).join(' · '))}</span>`:''}</span><span>${fmt(e.price,p.market)}</span><span>${e.qty}주<br><button class="btn" style="min-height:28px;padding:0 8px;margin-top:4px" onclick="editEvent('${p.id}','${e.id}')">수정</button></span></div>`).join('')||'<div class="note">내역 없음</div>'}
window.toggleDetail=id=>{const d=document.getElementById('detail-'+id),b=document.getElementById('detailBtn-'+id);if(!d)return;d.classList.toggle('hidden');if(b)b.textContent=d.classList.contains('hidden')?'내역 ▾':'내역 ▴'};
window.saveExchange=()=>{const v=n(document.getElementById('exchangeRate').value),btn=document.getElementById('exchangeSaveBtn');if(v>0){db.settings.exchangeRate=v;save();if(btn){btn.textContent='저장됨 ✓';btn.classList.add('save-flash');setTimeout(()=>{if(document.body.contains(btn)){btn.textContent='환율 저장';btn.classList.remove('save-flash')}},900)}const total=activePositions('US').reduce((a,p)=>a+investedTotal(p),0);const metrics=document.querySelectorAll('#us .summary .metric');if(metrics[1])metrics[1].querySelector('.v').textContent=fmtKRW(total*v)}};
window.simulateSell=id=>{const p=db.positions.find(x=>x.id===id);if(!p)return;const s=positionState(p),sell=n(document.getElementById('sim-'+id).value),out=document.getElementById('simout-'+id);if(!(sell>0)){out.textContent='가격을 입력하면 예상 순이익을 표시합니다.';return}const r=tradeProfit(p.market,s.avg,s.qty,sell);if(p.market==='KR'){out.innerHTML=`<b>순이익 ${fmt(r.profit,'KR')}</b> · ${pct(r.rate)}`}else{const ex=db.settings.exchangeRate,after=r.profit>0?r.profit*0.78:r.profit;out.innerHTML=`<b>순이익 ${fmt(r.profit,'US')}</b> · ${pct(r.rate)}<br>원화 약 ${fmtKRW(r.profit*ex)}<br>22% 제외 참고 ${fmt(after,'US')} · ${fmtKRW(after*ex)}`}}
function presetOptions(selected){return db.presets.map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${esc(x.name)} (${pct(x.target)} / ${pct(x.stop)})</option>`).join('')}
function tagOptions(selected=[]){return db.tags.map(t=>`<label class="chip"><input type="checkbox" value="${esc(t)}" class="tagCheck" ${selected.includes(t)?'checked':''}> ${esc(t)}</label>`).join('')}
function recalcPosition(p){let qty=0,cost=0,avg=0,cum=0,buySeq=0,sellSeq=0,invalid=false;for(const e of p.events){if(e.type==='BUY'){buySeq++;e.seq=buySeq;e.beforeAvg=avg;e.beforeQty=qty;cost+=n(e.price)*n(e.qty);qty+=n(e.qty);avg=qty?cost/qty:0;e.afterAvg=avg;e.afterQty=qty;e.hourBand=hourBand(e.time)}else{sellSeq++;e.seq=sellSeq;e.beforeAvg=avg;e.beforeQty=qty;const q=n(e.qty);const r=tradeProfit(p.market,avg,q,n(e.price));if(q>qty)invalid=true;qty=Math.max(0,qty-q);cost=Math.max(0,cost-avg*q);if(qty===0){cost=0;avg=0}e.afterAvg=avg;e.afterQty=qty;e.fee=r.fee;e.profit=r.profit;e.profitRate=r.rate;cum+=r.profit;e.cumulativeProfit=cum;e.hourBand=hourBand(e.time);if(p.market==='US'){const fx=n(e.exchangeRate);e.profitKRW=r.profit*fx;e.after22=r.profit>0?r.profit*.78:r.profit;e.after22KRW=e.after22*fx}}}p.closed=qty<=0&&p.events.some(e=>e.type==='SELL');p.closedAt=p.closed?[...p.events].reverse().find(e=>e.type==='SELL')?.date||'':null;return{qty,avg,costBasis:avg*qty,invalid}}
window.newPosition=market=>{openModal(`<div class="section-head"><h2>새 매수 · ${market==='KR'?'국장':'미장'}</h2><button class="btn" onclick="closeModal()">닫기</button></div><div class="grid">
<div class="field"><label>종목명</label><input class="input" id="npName"></div><div class="field"><label>티커</label><input class="input" id="npTicker"></div>
<div class="field"><label>매수가</label><input class="input" id="npPrice" type="number" step="${market==='KR'?1:0.01}"></div><div class="field"><label>수량</label><input class="input" id="npQty" type="number" step="1"></div>
<div class="field"><label>날짜</label><input class="input" id="npDate" type="date" value="${today()}"></div><div class="field"><label>시간 (한국시간)</label><input class="input" id="npTime" type="time" value="${nowTime()}"></div>
<div class="field"><label>프리셋</label><select class="select" id="npPreset">${presetOptions(db.presets[0]?.id)}</select></div></div>

window.saveNewPosition=market=>{const name=document.getElementById('npName').value.trim(),ticker=document.getElementById('npTicker').value.trim(),price=n(document.getElementById('npPrice').value),qty=n(document.getElementById('npQty').value),date=document.getElementById('npDate').value,time=document.getElementById('npTime').value,preset=db.presets.find(x=>x.id===document.getElementById('npPreset').value),memo=document.getElementById('npMemo').value.trim(),tags=[...document.querySelectorAll('.tagCheck:checked')].map(x=>x.value);if(!name||!(price>0)||!(qty>0)){alert('종목명, 매수가, 수량을 입력해주세요.');return}const p={id:crypto.randomUUID(),displayId:nextDisplayId(market,ticker),market,name,ticker,createdAt:new Date().toISOString(),closed:false,target:preset?.target??2,stop:preset?.stop??-1.5,presetName:preset?.name||'직접설정',tradeMemo:'',events:[]};p.events.push({id:crypto.randomUUID(),type:'BUY',seq:1,date,time,hourBand:hourBand(time),price,qty,memo,tags,beforeAvg:0,afterAvg:price,beforeQty:0,afterQty:qty});db.positions.push(p);save();closeModal();renderAll()}
window.addBuy=id=>{const p=db.positions.find(x=>x.id===id);if(!p)return;const s=positionState(p);openModal(`<div class="section-head"><h2>${esc(p.name)} 추가매수</h2><button class="btn" onclick="closeModal()">닫기</button></div><div class="grid"><div class="field"><label>추가 매수가</label><input class="input" id="abPrice" type="number" step="${p.market==='KR'?1:0.01}"></div><div class="field"><label>수량</label><input class="input" id="abQty" type="number"></div><div class="field"><label>날짜</label><input class="input" id="abDate" type="date" value="${today()}"></div><div class="field"><label>시간 (한국시간)</label><input class="input" id="abTime" type="time" value="${nowTime()}"></div></div><div class="field" style="margin-top:10px"><label>이유 태그</label><div class="chips">${tagOptions()}</div></div><div class="field" style="margin-top:10px"><label>메모</label><textarea class="textarea" id="abMemo"></textarea></div><div class="note" style="margin-top:8px">현재 평단 ${fmt(s.avg,p.market)} · ${s.qty}주</div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="saveAddBuy('${id}')">추가매수 저장</button></div>`)}
window.saveAddBuy=id=>{const p=db.positions.find(x=>x.id===id);if(!p)return;const s=positionState(p),price=n(document.getElementById('abPrice').value),qty=n(document.getElementById('abQty').value),date=document.getElementById('abDate').value,time=document.getElementById('abTime').value,memo=document.getElementById('abMemo').value.trim(),tags=[...document.querySelectorAll('.tagCheck:checked')].map(x=>x.value);if(!(price>0&&qty>0)){alert('가격과 수량을 입력해주세요.');return}const afterQty=s.qty+qty,afterAvg=(s.avg*s.qty+price*qty)/afterQty;p.events.push({id:crypto.randomUUID(),type:'BUY',seq:allBuys(p).length+1,date,time,hourBand:hourBand(time),price,qty,memo,tags,beforeAvg:s.avg,afterAvg,beforeQty:s.qty,afterQty});save();closeModal();renderAll()}
window.sellPosition=id=>{const p=db.positions.find(x=>x.id===id);if(!p)return;const s=positionState(p);openModal(`<div class="section-head"><h2>${esc(p.name)} 매도</h2><button class="btn" onclick="closeModal()">닫기</button></div><div class="note">현재 ${s.qty}주 · 평단 ${fmt(s.avg,p.market)} · 전량이 아니면 매도수량만 입력하세요.</div><div class="grid" style="margin-top:10px"><div class="field"><label>매도가</label><input class="input" id="spPrice" type="number" step="${p.market==='KR'?1:0.01}"></div><div class="field"><label>매도수량</label><input class="input" id="spQty" type="number" value="${s.qty}" max="${s.qty}"></div><div class="field"><label>날짜</label><input class="input" id="spDate" type="date" value="${today()}"></div><div class="field"><label>시간 (한국시간)</label><input class="input" id="spTime" type="time" value="${nowTime()}"></div>${p.market==='US'?`<div class="field"><label>매도 당시 환율</label><input class="input" id="spFx" type="number" value="${db.settings.exchangeRate}"></div>`:''}<div class="field"><label>원칙 상태</label><select class="select" id="spRule"><option>원칙대로</option><option>계획 변경</option><option>충동매도</option></select></div></div><div class="field" style="margin-top:10px"><label>매도 태그</label><div class="chips">${tagOptions()}</div></div><div class="field" style="margin-top:10px"><label>매도 메모</label><textarea class="textarea" id="spMemo"></textarea></div><div class="actions" style="margin-top:12px"><button class="btn good" onclick="saveSell('${id}')">매도 저장</button></div>`)}
window.saveSell=id=>{const p=db.positions.find(x=>x.id===id);if(!p)return;const s=positionState(p),price=n(document.getElementById('spPrice').value),qty=n(document.getElementById('spQty').value),date=document.getElementById('spDate').value,time=document.getElementById('spTime').value,memo=document.getElementById('spMemo').value.trim(),tags=[...document.querySelectorAll('.tagCheck:checked')].map(x=>x.value),rule=document.getElementById('spRule').value,fx=p.market==='US'?n(document.getElementById('spFx').value):'';if(!(price>0&&qty>0&&qty<=s.qty)){alert('매도가와 올바른 매도수량을 입력해주세요.');return}const r=tradeProfit(p.market,s.avg,qty,price);const afterQty=s.qty-qty;const cumulative=allSells(p).reduce((a,e)=>a+(e.profit||0),0)+r.profit;p.events.push({id:crypto.randomUUID(),type:'SELL',seq:allSells(p).length+1,date,time,hourBand:hourBand(time),price,qty,memo,tags,rule,beforeAvg:s.avg,afterAvg:afterQty>0?s.avg:0,beforeQty:s.qty,afterQty,fee:r.fee,profit:r.profit,profitRate:r.rate,cumulativeProfit:cumulative,exchangeRate:fx,profitKRW:p.market==='US'?r.profit*fx:'',after22:p.market==='US'?(r.profit>0?r.profit*0.78:r.profit):'',after22KRW:p.market==='US'?(r.profit>0?r.profit*0.78:r.profit)*fx:''});if(p.market==='US'&&fx>0)db.settings.exchangeRate=fx;if(afterQty<=0){p.closed=true;p.closedAt=date}save();closeModal();renderAll()}
window.editPosition=id=>{const p=db.positions.find(x=>x.id===id);if(!p)return;const presetId=db.presets.find(x=>x.name===p.presetName)?.id||'';openModal(`<div class="section-head"><h2>${esc(p.name)} 종목 설정 수정</h2><button class="btn" onclick="closeModal()">닫기</button></div><div class="note">수정 로그는 남기지 않고 최종값만 유지합니다. 프리셋을 선택하면 목표/손절 수치가 즉시 바뀌지만 직접 다시 입력해도 됩니다.</div><div class="grid" style="margin-top:10px"><div class="field"><label>종목명</label><input class="input" id="epName" value="${esc(p.name)}"></div><div class="field"><label>티커</label><input class="input" id="epTicker" value="${esc(p.ticker||'')}"></div><div class="field"><label>프리셋</label><select class="select" id="epPreset" onchange="applyEditPreset()"><option value="">직접설정</option>${presetOptions(presetId)}</select></div><div class="field"><label>목표 순이익률 (%)</label><input class="input" id="epTarget" type="number" step="0.1" value="${p.target}"></div><div class="field"><label>손절 순이익률 (%)</label><input class="input" id="epStop" type="number" step="0.1" value="${p.stop}"></div></div><div class="field" style="margin-top:10px"><label>거래 전체 메모</label><textarea class="textarea" id="epTradeMemo">${esc(p.tradeMemo||'')}</textarea></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="saveEditPosition('${id}')">최종값 저장</button></div>`)}
window.applyEditPreset=()=>{const id=document.getElementById('epPreset').value,p=db.presets.find(x=>x.id===id);if(p){document.getElementById('epTarget').value=p.target;document.getElementById('epStop').value=p.stop}}
window.saveEditPosition=id=>{const p=db.positions.find(x=>x.id===id);if(!p)return;const preset=db.presets.find(x=>x.id===document.getElementById('epPreset').value);p.name=document.getElementById('epName').value.trim()||p.name;p.ticker=document.getElementById('epTicker').value.trim();p.presetName=preset?.name||'직접설정';p.target=n(document.getElementById('epTarget').value);p.stop=n(document.getElementById('epStop').value);p.tradeMemo=document.getElementById('epTradeMemo').value.trim();delete p.settingChanges;delete p.presetSnapshot;save();closeModal();renderAll()}
window.editEvent=(pid,eid)=>{const p=db.positions.find(x=>x.id===pid),e=p?.events.find(x=>x.id===eid);if(!p||!e)return;openModal(`<div class="section-head"><h2>${esc(p.name)} · ${e.type==='BUY'?'매수':'매도'} ${e.seq}차 수정</h2><button class="btn" onclick="closeModal()">닫기</button></div><div class="note">실제 가격·수량을 수정하면 평단, 잔여수량, 손익을 모두 다시 계산합니다. 수정 이력은 남기지 않습니다.</div><div class="grid" style="margin-top:10px"><div class="field"><label>가격</label><input class="input" id="eePrice" type="number" value="${e.price}"></div><div class="field"><label>수량</label><input class="input" id="eeQty" type="number" value="${e.qty}"></div><div class="field"><label>날짜</label><input class="input" id="eeDate" type="date" value="${e.date}"></div><div class="field"><label>시간 (한국시간)</label><input class="input" id="eeTime" type="time" value="${e.time||''}"></div>${e.type==='SELL'&&p.market==='US'?`<div class="field"><label>매도 당시 환율</label><input class="input" id="eeFx" type="number" value="${e.exchangeRate||db.settings.exchangeRate}"></div>`:''}${e.type==='SELL'?`<div class="field"><label>원칙 상태</label><select class="select" id="eeRule"><option ${e.rule==='원칙대로'?'selected':''}>원칙대로</option><option ${e.rule==='계획 변경'?'selected':''}>계획 변경</option><option ${e.rule==='충동매도'?'selected':''}>충동매도</option></select></div>`:''}</div><div class="field" style="margin-top:10px"><label>${e.type==='BUY'?'매수':'매도'} 태그</label><div class="chips">${tagOptions(e.tags||[])}</div></div><div class="field" style="margin-top:10px"><label>메모</label><textarea class="textarea" id="eeMemo">${esc(e.memo||'')}</textarea></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="saveEditEvent('${pid}','${eid}')">수정 저장</button></div>`)}
window.saveEditEvent=(pid,eid)=>{const p=db.positions.find(x=>x.id===pid),e=p?.events.find(x=>x.id===eid);if(!p||!e)return;const price=n(document.getElementById('eePrice').value),qty=n(document.getElementById('eeQty').value);if(!(price>0&&qty>0)){alert('가격과 수량을 확인해주세요.');return}const old=structuredClone(e);e.price=price;e.qty=qty;e.date=document.getElementById('eeDate').value;e.time=document.getElementById('eeTime').value;e.hourBand=hourBand(e.time);e.memo=document.getElementById('eeMemo').value.trim();e.tags=[...document.querySelectorAll('.tagCheck:checked')].map(x=>x.value);if(e.type==='SELL'){e.rule=document.getElementById('eeRule').value;if(p.market==='US')e.exchangeRate=n(document.getElementById('eeFx').value)}const test=recalcPosition(p);if(test.invalid){Object.assign(e,old);recalcPosition(p);alert('수정 결과 중간 매도수량이 당시 보유수량을 초과합니다. 수량을 확인해주세요.');return}save();closeModal();renderAll()}
function renderHistory(){const el=document.getElementById('history'),rows=db.positions.slice().sort((a,b)=>(b.closedAt||b.createdAt).localeCompare(a.closedAt||a.createdAt));el.innerHTML=`<div class="card"><div class="section-head"><div><h2 style="margin-bottom:4px">매매 기록</h2><div class="note">CSV, MD로 저장하기. JSON 백업&복원하기</div></div></div><div class="actions"><button class="btn" onclick="exportCSV()">CSV</button><button class="btn" onclick="exportMD()">MD</button><button class="btn" onclick="exportJSON()">백업</button><button class="btn" onclick="importJSON()">복원</button></div><input id="jsonFile" type="file" accept="application/json" class="hidden"></div>${rows.length?rows.map(historyCard).join(''):`<div class="card"><div class="note">기록이 없습니다.</div></div>`}`}
function historyCard(p){const s=positionState(p),sells=allSells(p),profit=sells.reduce((a,e)=>a+(e.profit||0),0),invest=allBuys(p).reduce((a,e)=>a+e.price*e.qty,0),rate=invest?profit/invest*100:0;return `<div class="card"><div class="position-title"><div><div class="name">${esc(p.name)} ${p.ticker?`<span class="muted">${esc(p.ticker)}</span>`:''}</div><div class="muted">${esc(p.displayId)} · ${p.market==='KR'?'국장':'미장'} · ${p.closed?'종료':'진행중'}</div></div><span class="badge ${p.closed?'closed':''}">${p.closed?'종료':'보유중'}</span></div><div class="summary" style="margin-top:10px"><div class="metric"><div class="k">매수횟수</div><div class="v">${allBuys(p).length}</div></div><div class="metric"><div class="k">매도횟수</div><div class="v">${sells.length}</div></div><div class="metric ${profit>=0?'good':'danger'}"><div class="k">누적 실현손익</div><div class="v">${fmt(profit,p.market)}<div class="tiny">${pct(rate)}</div></div></div></div>${p.tradeMemo?`<div class="note" style="margin-top:10px"><b>거래 메모</b> · ${esc(p.tradeMemo)}</div>`:''}<div class="actions" style="margin-top:10px"><button class="btn" onclick="editPosition('${p.id}')">거래 설정 수정</button></div><div class="detail">${renderEventHistory(p)}</div></div>`}
function eventCSVRows(){const rows=[];for(const p of db.positions){const firstBuy=allBuys(p)[0];for(const e of p.events){rows.push({거래ID:p.displayId,내부ID:p.id,시장:p.market==='KR'?'국장':'미장',티커:p.ticker||'',종목명:p.name,이벤트유형:e.type==='BUY'?'매수':'매도',이벤트차수:e.seq,날짜:e.date,시간:e.time||'',시간대:e.hourBand||'',가격:e.price,수량:e.qty,거래금액:e.price*e.qty,거래전평단:e.beforeAvg??'',거래후평단:e.afterAvg??'',거래전수량:e.beforeQty??'',거래후수량:e.afterQty??'',프리셋명:p.presetName||p.presetSnapshot?.name||'직접설정',최종목표순이익률:p.target,최종손절순이익률:p.stop,거래전체메모:p.tradeMemo||'',이유태그:(e.tags||[]).join('|'),수수료:e.fee??'',이번순이익:e.profit??'',이번순이익률:e.profitRate??'',누적순이익:e.cumulativeProfit??'',보유일수:firstBuy?daysBetween(firstBuy.date,e.date):'',메모:e.memo||'',원칙상태:e.rule||'',거래상태:p.closed?'종료':'진행중',매도당시환율:e.exchangeRate??'',순이익원화환산:e.profitKRW??'',"22퍼센트제외참고순이익":e.after22??'',"22퍼센트제외원화환산":e.after22KRW??''})}}return rows}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
window.exportCSV=()=>{const data=eventCSVRows();if(!data.length){alert('내보낼 기록이 없습니다.');return}const headers=Object.keys(data[0]);const csv=[headers.map(csvCell).join(','),...data.map(r=>headers.map(h=>csvCell(r[h])).join(','))].join('\r\n');download(`주식매매_전체기록_${today()}.csv`,'\uFEFF'+csv,'text/csv;charset=utf-8')}
window.exportMD=()=>{if(!db.positions.length){alert('내보낼 기록이 없습니다.');return}let md=`# 주식 매매 기록\n\n생성일: ${today()}\n\n`;const groups={};for(const p of db.positions){const k=(p.closedAt||allBuys(p)[0]?.date||today()).slice(0,7);(groups[k]=groups[k]||[]).push(p)}for(const month of Object.keys(groups).sort().reverse()){md+=`## ${month}\n\n`;for(const p of groups[month]){const buys=allBuys(p),sells=allSells(p),profit=sells.reduce((a,e)=>a+(e.profit||0),0);md+=`### ${p.name}${p.ticker?` (${p.ticker})`:''} · ${p.presetName||p.presetSnapshot?.name||'직접설정'}\n`+`- 거래ID: ${p.displayId}\n- 상태: ${p.closed?'종료':'진행중'}\n- 매수: ${buys.map(e=>`${e.date} ${fmt(e.price,p.market)} × ${e.qty}주`).join(' / ')}\n`+`- 매도: ${sells.length?sells.map(e=>`${e.date} ${fmt(e.price,p.market)} × ${e.qty}주`).join(' / '):'아직 없음'}\n- 누적 실현손익: ${fmt(profit,p.market)}\n`;const memos=p.events.filter(e=>e.memo).map(e=>`  - ${e.type==='BUY'?'매수':'매도'} ${e.seq}차: ${e.memo}`);if(p.tradeMemo)md+=`- 거래 메모: ${p.tradeMemo}\n`;if(memos.length)md+=`- 이벤트 메모\n${memos.join('\n')}\n`;md+='\n'}}download(`주식매매_읽기용_${today()}.md`,md,'text/markdown;charset=utf-8')}
window.exportJSON=()=>download(`주식매매_전체백업_${today()}.json`,JSON.stringify(db,null,2),'application/json');
window.importJSON=()=>{const input=document.getElementById('jsonFile');input.onchange=()=>{const f=input.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!x.version||!Array.isArray(x.positions))throw 0;if(confirm('현재 데이터를 백업 파일로 교체할까요?')){db=x;save();renderAll()}}catch(e){alert('올바른 백업 파일이 아닙니다.')}};rd.readAsText(f)};input.click()}
function download(name,content,type){const b=new Blob([content],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function renderWatering(){const el=document.getElementById('watering');el.innerHTML=`<div class="card"><div class="section-head"><div><h2 style="margin-bottom:4px">물타기 계산</h2><div class="note">실제 보유기록과 동기화하지 않는 임시 시뮬레이션입니다. 수수료·세금 미반영. 세 계산을 동시에 채워도 원하는 카드만 따로 저장할 수 있습니다.</div></div><button class="btn" onclick="openHoldingPicker()">보유종목 불러오기</button></div><div class="grid"><div class="field"><label>종목명</label><input class="input" id="wName"></div><div class="field"><label>시장</label><div class="market-toggle"><button class="btn on" id="wMarketKR" onclick="setWaterMarket('KR')">국장</button><button class="btn" id="wMarketUS" onclick="setWaterMarket('US')">미장</button></div><input type="hidden" id="wMarket" value="KR"></div><div class="field"><label>현재 평단</label><input class="input" id="wAvg" type="number"></div><div class="field"><label>현재 수량</label><input class="input" id="wQty" type="number"></div></div></div>
<div class="watering-modes"><div class="watering-box"><h3>① 매수가 + 수량</h3><div class="field"><label>추가 매수가</label><input class="input wcalc" id="w1p" type="number"></div><div class="field" style="margin-top:8px"><label>추가 수량</label><input class="input wcalc" id="w1q" type="number"></div><div class="note" id="w1out" style="margin-top:10px">입력 즉시 계산</div><button class="btn primary" style="margin-top:10px;width:100%" onclick="saveWateringMode(1)">① 이 계산 저장</button></div><div class="watering-box"><h3>② 매수가 + 목표 평단</h3><div class="field"><label>추가 매수가</label><input class="input wcalc" id="w2p" type="number"></div><div class="field" style="margin-top:8px"><label>목표 평단</label><input class="input wcalc" id="w2a" type="number"></div><div class="note" id="w2out" style="margin-top:10px">필요 수량 계산</div><button class="btn primary" style="margin-top:10px;width:100%" onclick="saveWateringMode(2)">② 이 계산 저장</button></div><div class="watering-box"><h3>③ 매수가 + 예산</h3><div class="field"><label>추가 매수가</label><input class="input wcalc" id="w3p" type="number"></div><div class="field" style="margin-top:8px"><label>예산</label><input class="input wcalc" id="w3b" type="number"></div><div class="note" id="w3out" style="margin-top:10px">가능 수량과 새 평단 계산</div><button class="btn primary" style="margin-top:10px;width:100%" onclick="saveWateringMode(3)">③ 이 계산 저장</button></div></div>
<div class="card"><h3>임시 저장</h3><div id="wateringSaved" style="margin-top:12px">${renderWateringSaved()}</div></div>`;document.querySelectorAll('.wcalc,#wAvg,#wQty,#wName').forEach(x=>x.addEventListener('input',calcWatering));calcWatering()}
window.setWaterMarket=market=>{const hidden=document.getElementById('wMarket');if(!hidden)return;hidden.value=market;document.getElementById('wMarketKR')?.classList.toggle('on',market==='KR');document.getElementById('wMarketUS')?.classList.toggle('on',market==='US');calcWatering()}
window.openHoldingPicker=()=>{const ps=db.positions.filter(p=>!p.closed&&positionState(p).qty>0);if(!ps.length){alert('현재 보유 중인 종목이 없습니다.');return}openModal(`<div class="section-head"><h2>보유종목 불러오기</h2><button class="btn" onclick="closeModal()">닫기</button></div><div class="note">종목명·현재 평단·현재 수량만 물타기 계산기로 가져옵니다. 실제 보유기록은 변경되지 않습니다.</div><div style="margin-top:12px">${ps.map(p=>{const st=positionState(p);return `<button class="btn" style="width:100%;height:auto;padding:12px;text-align:left;margin-bottom:8px" onclick="loadHoldingToWatering('${p.id}')"><b style="color:#047857">${esc(p.name)}</b>${p.ticker?` <span class="muted">${esc(p.ticker)}</span>`:''}<br><span class="tiny">${p.market==='KR'?'국장':'미장'} · 평단 ${fmt(st.avg,p.market)} · ${st.qty}주</span></button>`}).join('')}</div>`)}
window.loadHoldingToWatering=id=>{const p=db.positions.find(x=>x.id===id);if(!p)return;const st=positionState(p);closeModal();document.getElementById('wName').value=p.name;document.getElementById('wAvg').value=st.avg;document.getElementById('wQty').value=st.qty;setWaterMarket(p.market);calcWatering()}
function calcWatering(){if(!document.getElementById('wAvg'))return;const market=document.getElementById('wMarket').value,avg=n(document.getElementById('wAvg').value),qty=n(document.getElementById('wQty').value),cost=avg*qty,f=v=>fmt(v,market),name=document.getElementById('wName').value.trim();let results={};const p1=n(document.getElementById('w1p').value),q1=n(document.getElementById('w1q').value);if(avg>0&&qty>0&&p1>0&&q1>0){const nq=qty+q1,na=(cost+p1*q1)/nq;results[1]={mode:1,price:p1,qty:q1,newQty:nq,newAvg:na};document.getElementById('w1out').innerHTML=`새 평단 <b>${f(na)}</b> · 총 ${nq}주 · 추가금 ${f(p1*q1)}`}else document.getElementById('w1out').textContent='입력 즉시 계산';const p2=n(document.getElementById('w2p').value),a2=n(document.getElementById('w2a').value);if(avg>0&&qty>0&&p2>0&&a2>0){if((p2<a2&&a2<avg)||(p2>a2&&a2>avg)){const exact=(avg*qty-a2*qty)/(a2-p2),need=Math.ceil(exact);if(need>0){const na=(cost+p2*need)/(qty+need);results[2]={mode:2,price:p2,targetAvg:a2,qty:need,newQty:qty+need,newAvg:na};document.getElementById('w2out').innerHTML=`필요 <b>${need}주</b> · 예상 사용 ${f(p2*need)} · 계산 후 평단 ${f(na)}`}else document.getElementById('w2out').textContent='목표 평단을 확인해주세요.'}else document.getElementById('w2out').textContent='목표 평단은 현재 평단과 추가 매수가 사이여야 합니다.'}else document.getElementById('w2out').textContent='필요 수량 계산';const p3=n(document.getElementById('w3p').value),b3=n(document.getElementById('w3b').value);if(avg>0&&qty>0&&p3>0&&b3>0){const aq=Math.floor(b3/p3);if(aq>0){const na=(cost+p3*aq)/(qty+aq);results[3]={mode:3,price:p3,budget:b3,qty:aq,newQty:qty+aq,newAvg:na};document.getElementById('w3out').innerHTML=`가능 <b>${aq}주</b> · 새 평단 ${f(na)} · 실제 사용 ${f(p3*aq)}`}else document.getElementById('w3out').textContent='예산으로 1주 이상 살 수 없습니다.'}else document.getElementById('w3out').textContent='가능 수량과 새 평단 계산';window.currentWatering={market,avg,qty,name,results}}
window.saveWateringMode=mode=>{calcWatering();const w=window.currentWatering,r=w?.results?.[mode];if(!r){alert(`${mode}번 계산에 필요한 값을 먼저 입력해주세요.`);return}if(db.wateringPlans.length>=10){alert('임시 저장은 최대 10개입니다. 먼저 하나를 삭제해주세요.');return}db.wateringPlans.unshift({id:crypto.randomUUID(),savedAt:new Date().toISOString(),market:w.market,avg:w.avg,qty:w.qty,name:w.name,result:{...r}});save();document.getElementById('wateringSaved').innerHTML=renderWateringSaved()}
function renderWateringSaved(){if(!db.wateringPlans.length)return '<div class="note">저장된 물타기 계산이 없습니다.</div>';const labels={1:'① 수량 기준',2:'② 목표평단 기준',3:'③ 예산 기준'};return db.wateringPlans.map(x=>`<div class="saved-plan"><b>${esc(x.name||'이름 없음')} · ${x.market==='KR'?'국장':'미장'} · ${labels[x.result.mode]||''}</b><div class="note">현재 ${fmt(x.avg,x.market)} × ${x.qty}주 → ${fmt(x.result.price,x.market)}에 ${x.result.qty}주 추가 → 새 평단 <b>${fmt(x.result.newAvg,x.market)}</b></div><button class="btn danger" style="margin-top:8px" onclick="deleteWatering('${x.id}')">삭제</button></div>`).join('')}
window.deleteWatering=id=>{db.wateringPlans=db.wateringPlans.filter(x=>x.id!==id);save();const el=document.getElementById('wateringSaved');if(el)el.innerHTML=renderWateringSaved()}
function renderSettings(){openModal(`<div class="section-head"><h2>설정</h2><button class="btn" onclick="closeModal()">닫기</button></div><div class="grid"><div class="field"><label>국장 최소 순익 기준</label><input class="input" id="stKR" type="number" value="${db.settings.krMinProfit}"></div><div class="field"><label>미장 최소 순익 기준 ($)</label><input class="input" id="stUS" type="number" value="${db.settings.usMinProfit}"></div></div><div class="settings-group"><h3>프리셋</h3><div id="presetEditor">${db.presets.map((p,i)=>`<div class="grid3" style="margin-bottom:8px"><input class="input spName" data-i="${i}" value="${esc(p.name)}"><input class="input spTarget" data-i="${i}" type="number" step="0.1" value="${p.target}"><div style="display:flex;gap:6px"><input class="input spStop" data-i="${i}" type="number" step="0.1" value="${p.stop}"><button class="btn danger" onclick="removePreset(${i})">삭제</button></div></div>`).join('')}</div><button class="btn" onclick="addPresetRow()">＋ 프리셋 추가</button></div><div class="settings-group"><h3>진입 이유 태그</h3><div id="tagEditor">${db.tags.map((t,i)=>`<div style="display:flex;gap:6px;margin-bottom:7px"><input class="input tagName" data-i="${i}" value="${esc(t)}"><button class="btn danger" onclick="removeTag(${i})">삭제</button></div>`).join('')}</div><button class="btn" onclick="addTagRow()">＋ 태그 추가</button></div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="saveSettings()">설정 저장</button></div><div class="settings-group"><h3>전체 데이터 초기화</h3><div class="note">현재 보유 종목, 완료 기록, 메모, 태그, 프리셋, 환율, 물타기 임시저장까지 이 기기의 앱 데이터를 모두 삭제합니다. JSON 백업 파일 자체는 삭제되지 않습니다.</div><button class="btn danger" style="margin-top:10px" onclick="resetAllData()">전체 데이터 초기화</button></div>`)}
window.removePreset=i=>{document.querySelectorAll('.spName,.spTarget,.spStop').forEach(()=>{});db.presets.splice(i,1);save();renderSettings()}
window.addPresetRow=()=>{db.presets.push({id:crypto.randomUUID(),name:'새 프리셋',target:2,stop:-1.5});save();renderSettings()}
window.removeTag=i=>{db.tags.splice(i,1);save();renderSettings()}
window.addTagRow=()=>{db.tags.push('새 태그');save();renderSettings()}
window.saveSettings=()=>{const names=[...document.querySelectorAll('.spName')],targets=[...document.querySelectorAll('.spTarget')],stops=[...document.querySelectorAll('.spStop')];db.presets=names.map((x,i)=>({id:db.presets[i]?.id||crypto.randomUUID(),name:x.value.trim()||`프리셋${i+1}`,target:n(targets[i].value),stop:n(stops[i].value)}));db.tags=[...document.querySelectorAll('.tagName')].map(x=>x.value.trim()).filter(Boolean);db.settings.krMinProfit=Math.max(0,n(document.getElementById('stKR').value));db.settings.usMinProfit=Math.max(0,n(document.getElementById('stUS').value));save();closeModal();renderAll()}
window.resetAllData=()=>{if(!confirm('정말 전체 데이터를 초기화할까요?\n\n현재 보유 종목, 매매기록, 프리셋, 태그, 메모, 환율, 물타기 임시저장이 모두 삭제됩니다.\n필요하면 먼저 JSON 전체 백업을 저장해주세요.'))return;const typed=prompt('실수 방지를 위해 초기화 라고 입력해주세요.');if(typed!=='초기화'){alert('초기화를 취소했습니다.');return}localStorage.removeItem(KEY);localStorage.removeItem(OLD_KEY);db=freshDB();save();closeModal();renderAll();alert('전체 데이터가 초기화되었습니다.')}
document.getElementById('openSettings').onclick=renderSettings;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab));if(b.dataset.tab==='history')renderHistory();if(b.dataset.tab==='watering')renderWatering()});

let deferredInstallPrompt=null;const installBtn=document.getElementById('installBtn');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;installBtn.classList.remove('hidden')});installBtn.onclick=async()=>{if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;installBtn.classList.add('hidden')};window.addEventListener('appinstalled',()=>installBtn.classList.add('hidden'));if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
function renderAll(){for(const p of db.positions)recalcPosition(p);renderMarket('KR');renderMarket('US');renderHistory();renderWatering()}
renderAll();
</script>
</body>
</html>
